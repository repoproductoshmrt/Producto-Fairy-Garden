<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseño 001 · Casa de Hongo con Puerta Roja</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    overflow:hidden;              /* nunca dejar que aparezca scroll propio */
    background:#141d15;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;                 /* siempre el alto real del iframe, sea cual sea */
    width:100%;
  }

  /* ---- pestañas ---- */
  .tabbar{
    flex:0 0 auto;
    display:flex;
    gap:5px;
    background:#16281c;
    padding:7px 7px;
  }
  .tabbar button{
    flex:1;
    background:transparent;
    border:none;
    color:#cfd9c9;
    font-size:12px;
    font-weight:600;
    padding:7px 4px;
    border-radius:8px;
    font-family:inherit;
    cursor:pointer;
  }
  .tabbar button.active{
    background:#cc9c4d;
    color:#16281c;
  }

  /* ---- zona de imagen: ocupa TODO el espacio restante, nunca más ---- */
  .stage{
    flex:1 1 auto;
    min-height:0;                 /* clave: permite que flex encoja en vez de desbordar */
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#0f1811;
    padding:8px;
  }
  .stage img{
    max-width:100%;
    max-height:100%;
    width:auto;
    height:auto;
    object-fit:contain;
    display:block;
    border-radius:6px;
    box-shadow:0 4px 18px rgba(0,0,0,.35);
  }

  /* ---- flechas superpuestas, no ocupan alto propio ---- */
  .nav-btn{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:34px;
    height:34px;
    border-radius:50%;
    background:rgba(15,24,17,.55);
    border:1px solid rgba(255,255,255,.25);
    color:#f4efdc;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .nav-btn.prev{left:8px;}
  .nav-btn.next{right:8px;}
  .nav-btn:disabled{opacity:.25;pointer-events:none;}

  /* ---- puntos de página, superpuestos sobre el borde inferior ---- */
  .dots{
    position:absolute;
    bottom:6px;
    left:0;
    right:0;
    display:flex;
    justify-content:center;
    gap:6px;
  }
  .dots span{
    width:6px;
    height:6px;
    border-radius:50%;
    background:rgba(255,255,255,.35);
  }
  .dots span.active{background:#cc9c4d;}
</style>
</head>
<body>

<div class="app">
  <div class="tabbar" id="tabbar">
    <button data-i="0">Venta</button>
    <button data-i="1">Diseño</button>
    <button data-i="2">Preparación</button>
    <button data-i="3">Montaje</button>
  </div>

  <div class="stage">
    <button class="nav-btn prev" id="prev" aria-label="Anterior">&larr;</button>
    <img id="img" src="assets/4-venta.png" alt="Diseño 001">
    <button class="nav-btn next" id="next" aria-label="Siguiente">&rarr;</button>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
  const pages = ['assets/4-venta.png','assets/1-diseno.png','assets/2-preparacion.png','assets/3-montaje.png'];
  const buttons = [...document.querySelectorAll('#tabbar button')];
  const img = document.getElementById('img');
  const dotsWrap = document.getElementById('dots');
  let current = 0;

  pages.forEach((_,i)=>{
    const d = document.createElement('span');
    dotsWrap.appendChild(d);
  });
  const dots = [...dotsWrap.children];

  function show(i){
    current = (i + pages.length) % pages.length;
    img.src = pages[current];
    buttons.forEach((b,idx)=>b.classList.toggle('active', idx===current));
    dots.forEach((d,idx)=>d.classList.toggle('active', idx===current));
    document.getElementById('prev').disabled = current===0;
    document.getElementById('next').disabled = current===pages.length-1;
  }

  buttons.forEach((b,idx)=>b.addEventListener('click', ()=>show(idx)));
  document.getElementById('prev').addEventListener('click', ()=>show(current-1));
  document.getElementById('next').addEventListener('click', ()=>show(current+1));

  let startX = 0;
  document.querySelector('.stage').addEventListener('touchstart', e=>startX=e.touches[0].clientX);
  document.querySelector('.stage').addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - startX;
    if (dx > 40) show(current-1);
    if (dx < -40) show(current+1);
  });

  show(0);
</script>

</body>
</html>
