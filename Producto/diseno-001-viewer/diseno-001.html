<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Diseño 001 · Casa de Hongo con Puerta Roja</title>
<style>
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:#141d15;
    font-family:-apple-system,Segoe UI,Roboto,sans-serif;
  }
  .tabbar{
    position:sticky;
    top:0;
    z-index:10;
    display:flex;
    background:#16281c;
    padding:10px 8px;
    gap:6px;
  }
  .tabbar button{
    flex:1;
    background:transparent;
    border:none;
    color:#cfd9c9;
    font-size:12.5px;
    font-weight:600;
    padding:9px 4px;
    border-radius:9px;
    font-family:inherit;
  }
  .tabbar button.active{
    background:#cc9c4d;
    color:#16281c;
  }
  .viewer{
    max-width:900px;
    margin:0 auto;
    padding:10px;
  }
  .viewer img{
    width:100%;
    height:auto;
    display:block;
    border-radius:6px;
  }
  .pager{
    display:flex;
    justify-content:space-between;
    max-width:900px;
    margin:0 auto;
    padding:0 14px 20px;
  }
  .pager button{
    background:#16281c;
    color:#f0e6c8;
    border:1px solid #33472f;
    padding:10px 16px;
    border-radius:8px;
    font-size:13px;
    font-family:inherit;
  }
  .pager button:disabled{opacity:.35;}
</style>
</head>
<body>

<div class="tabbar" id="tabbar">
  <button data-i="0">Venta</button>
  <button data-i="1">Diseño</button>
  <button data-i="2">Preparación</button>
  <button data-i="3">Montaje</button>
</div>

<div class="viewer">
  <img id="img" src="assets/4-venta.png" alt="Diseño 001">
</div>

<div class="pager">
  <button id="prev">&larr; Anterior</button>
  <button id="next">Siguiente &rarr;</button>
</div>

<script>
  const pages = ['assets/4-venta.png','assets/1-diseno.png','assets/2-preparacion.png','assets/3-montaje.png'];
  const buttons = [...document.querySelectorAll('#tabbar button')];
  const img = document.getElementById('img');
  let current = 0;

  function show(i){
    current = (i + pages.length) % pages.length;
    img.src = pages[current];
    buttons.forEach((b,idx)=>b.classList.toggle('active', idx===current));
    document.getElementById('prev').disabled = current===0;
    document.getElementById('next').disabled = current===pages.length-1;
  }

  buttons.forEach((b,idx)=>b.addEventListener('click', ()=>show(idx)));
  document.getElementById('prev').addEventListener('click', ()=>show(current-1));
  document.getElementById('next').addEventListener('click', ()=>show(current+1));

  // swipe support
  let startX = 0;
  document.querySelector('.viewer').addEventListener('touchstart', e=>startX=e.touches[0].clientX);
  document.querySelector('.viewer').addEventListener('touchend', e=>{
    const dx = e.changedTouches[0].clientX - startX;
    if (dx > 50) show(current-1);
    if (dx < -50) show(current+1);
  });

  show(0);
</script>

</body>
</html>
